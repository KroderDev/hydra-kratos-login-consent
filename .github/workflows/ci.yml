name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Vet
        run: go vet ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: End-to-end provider contract
        run: go test -race -tags=integration -count=1 -shuffle=on ./...

  realstack:
    runs-on: ubuntu-latest
    env:
      REALSTACK_CLIENT_SECRET: realstack-client-secret
      REALSTACK_PASSWORD: realstack-operator-password
      REALSTACK_BASIC_PASSWORD: realstack-basic-password
      REALSTACK_POLICY_TOKEN: realstack-policy-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start pinned Hydra, Kratos, Redis, policy, and provider
        run: docker compose -f docker-compose.realstack.yml up --build --wait
      - name: OIDC code and PKCE smoke
        run: go test -race -tags=integration,realstack -count=1 -shuffle=on ./internal/e2e
      - name: Real-stack logs
        if: failure()
        run: docker compose -f docker-compose.realstack.yml logs --no-color
      - name: Stop real stack
        if: always()
        run: docker compose -f docker-compose.realstack.yml down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ''
          go-version-file: go.mod
          go-package: ./...
