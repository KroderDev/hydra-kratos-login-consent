version: v2.2.0

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true

log:
  level: info
  format: json

urls:
  self:
    issuer: http://localhost:4444/
  login: http://localhost:8080/login
  consent: http://localhost:8080/consent
  logout: http://localhost:8080/logout

secrets:
  system:
    - realstack-system-secret

oidc:
  subject_identifiers:
    supported_types:
      - public
      - pairwise
    pairwise:
      salt: realstack-pairwise-salt

oauth2:
  hashers:
    bcrypt:
      cost: 4
