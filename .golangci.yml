version: "2"
run:
  # Keep lint runs bounded in local and CI environments.
  timeout: 5m
  tests: true
linters:
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - forcetypeassert
    - gocritic
    - gosec
    - intrange
    - loggercheck
    - misspell
    - nilerr
    - noctx
    - paralleltest
    - predeclared
    - revive
    - thelper
    - unconvert
    - usestdlibvars
    - whitespace
  disable:
    - dupl
    - err113
    - funlen
    - goconst
    - gocyclo
    - godot
    - lll
    - nestif
    - testifylint
    - wrapcheck
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
